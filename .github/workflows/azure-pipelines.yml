name: Terraform CI and Auto PR

on:
  push:
    branches:
      - 'feature/*'

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # =====================================================
  # 1. Terraform validation
  # =====================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate


  # =====================================================
  # 2. Create PR
  # =====================================================
  create-pr:
    name: Create Pull Request
    needs: terraform
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then

            echo "Creating Pull Request..."

            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Auto PR: ${{ github.ref_name }} → main" \
              --body "Automatically created after Terraform validation passed."

          else

            echo "PR already exists: #$PR_NUMBER"

          fi


  # =====================================================
  # 3. PR validation
  # =====================================================
  pr-validation:
    name: PR Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate


  # =====================================================
  # 4. Merge PR
  # =====================================================
  merge-pr:
    name: Merge Pull Request
    needs: pr-validation
    if: github.event_name == 'pull_request' && needs.pr-validation.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Terraform PR validation passed."
          echo "Merging PR #$PR_NUMBER..."

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch

          echo "PR #$PR_NUMBER merged successfully."

