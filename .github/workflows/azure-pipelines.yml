name: Terraform CI and Auto PR

on:
  push:
    branches:
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found. Creating new PR..."

            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Auto PR: ${{ github.ref_name }} → main" \
              --body "Automatically created after Terraform validation passed."

            PR_NUMBER=$(gh pr list \
              --head "${{ github.ref_name }}" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
          else
            echo "Existing PR found."
          fi

          echo "PR Number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for PR Checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"

          echo "Waiting for PR #$PR_NUMBER checks..."

          for i in {1..30}; do

            echo "Checking PR status - Attempt $i of 30"

            STATUS=$(gh pr checks "$PR_NUMBER" --json state --jq '.[].state' 2>/dev/null || true)

            echo "Current check status:"
            echo "$STATUS"

            if echo "$STATUS" | grep -q "FAILURE"; then
              echo "PR checks failed."
              exit 1
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo "PR checks have an error."
              exit 1
            fi

            if [ -n "$STATUS" ] && ! echo "$STATUS" | grep -Eq "PENDING|QUEUED|IN_PROGRESS"; then
              echo "PR checks completed successfully."
              exit 0
            fi

            echo "Checks are still running. Waiting 10 seconds..."
            sleep 10

          done

          echo "Timed out waiting for PR checks."
          exit 1

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"

          echo "All PR checks passed."
          echo "Merging PR #$PR_NUMBER..."

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch

          echo "PR #$PR_NUMBER merged successfully."

