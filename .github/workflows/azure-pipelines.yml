name: Terraform Preprod Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '${{ secrets.pipeline_secret }}'

      - name: Terraform Init
        working-directory: Parent/preprod
        run: terraform init

      - name: Terraform Apply
        working-directory: Parent/preprod
        run: terraform apply -auto-approve